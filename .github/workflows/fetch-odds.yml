name: Fetch odds

on:
  schedule:
    # 7am, noon, and 7pm Central (CDT = UTC-5). Cron is fixed UTC, so once
    # DST ends in November these will land an hour later in real Central
    # time until updated to the UTC-6 offset.
    - cron: '0 12,17,0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Fetch odds and scores
        run: node scripts/run.mjs

      - name: Commit if changed
        run: |
          git config user.name "rlm-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/seed-games.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Auto-update game data [skip ci]"
          git push

name: Fetch odds

on:
  schedule:
    # Fires at both possible UTC offsets for 7am/noon/7pm Central (CDT is
    # UTC-5, CST is UTC-6) -- the "Check Central time" step below skips the
    # run entirely except at the one that's actually correct right now, so
    # this stays accurate through the DST switch with no manual update.
    - cron: '0 12,13,17,18,0,1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check Central time
        id: gate
        run: |
          hour=$(TZ="America/Chicago" date +%H)
          if [ "$hour" = "07" ] || [ "$hour" = "12" ] || [ "$hour" = "19" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping -- it's $hour:00 Central, not one of 7am/noon/7pm"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        with:
          # Full history, not the default shallow clone -- run.mjs walks
          # past commits of seed-games.json to recover each game's true
          # first-seen date for the client's open-date backfill.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Fetch odds and scores
        if: steps.gate.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        run: node scripts/run.mjs

      - name: Commit if changed
        if: steps.gate.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "rlm-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/seed-games.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Auto-update game data [skip ci]"
          git push

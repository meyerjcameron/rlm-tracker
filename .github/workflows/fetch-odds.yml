name: Fetch odds

on:
  schedule:
    # Baseline 3x/day (7am/noon/7pm Central), every day. Two attempts, 15
    # minutes apart, at each of the two possible UTC offsets (CDT is
    # UTC-5, CST is UTC-6) -- GitHub's schedule trigger is best-effort and
    # can silently drop an individual firing under load, so a second
    # attempt close behind catches that without doing the work twice (see
    # "Check if due" below).
    - cron: '0,15 12,13,17,18,0,1 * * *'
    # Extra checks around when games actually finish, so a just-ended game
    # doesn't sit showing as live for hours until the next baseline check.
    # Central day-of-week/hour, both DST offsets, same two-attempt pattern:
    #   Sat/Sun ~3pm (early-window games wrapping up)  -> UTC 20/21, Sat+Sun
    #   Sat ~10pm (evening-window games wrapping up)    -> UTC 3/4, Sunday
    #   Thu/Fri/Sun ~11pm (TNF/CFB-Fri/SNF wrapping up) -> UTC 4/5, Fri+Sat+Mon
    - cron: '0,15 20,21 * * 0,6'
    - cron: '0,15 3,4 * * 0'
    - cron: '0,15 4,5 * * 1,5,6'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone -- run.mjs walks
          # past commits of seed-games.json to recover each game's true
          # first-seen date for the client's open-date backfill, and the
          # gate step below reads the last commit's time.
          fetch-depth: 0

      - name: Check if due
        id: gate
        run: |
          hour=$(TZ="America/Chicago" date +%H)
          case "$hour" in
            07|12|15|19|22|23) ;;
            *)
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "Skipping -- it's $hour:00 Central, not a scheduled check time"
              exit 0
              ;;
          esac
          last_epoch=$(git log -1 --format=%ct -- public/seed-games.json)
          now_epoch=$(date +%s)
          elapsed_min=$(( (now_epoch - last_epoch) / 60 ))
          if [ "$elapsed_min" -lt 50 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping -- already updated $elapsed_min minute(s) ago (this is the redundant backup attempt)"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Fetch odds and scores
        if: steps.gate.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        run: node scripts/run.mjs

      - name: Commit if changed
        if: steps.gate.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "rlm-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/seed-games.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Auto-update game data [skip ci]"
          git push

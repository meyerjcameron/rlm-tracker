name: Fetch odds

on:
  schedule:
    # GitHub's schedule trigger is best-effort and can drift by *hours*
    # under load -- confirmed directly: a day's worth of runs that were
    # supposed to land at 7am/noon/3pm/7pm Central instead fired at
    # 10:45am/2:18pm/4:58pm/etc, 2-4 hours late every single time. Trying
    # to gate on "is it currently one of these specific hours" was
    # rejecting almost every real firing, since by the time GitHub actually
    # ran it the clock had drifted into some other hour entirely.
    #
    # So this no longer targets specific times at all: it fires frequently
    # (nominally every 20 minutes, though GitHub's own throttling means the
    # real cadence is often much lower) and the gate below just checks how
    # long it's actually been since the last real update, catching up
    # immediately whenever GitHub does get around to running it.
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone -- run.mjs walks
          # past commits of seed-games.json to recover each game's true
          # first-seen date for the client's open-date backfill, and the
          # gate step below reads the last commit's time.
          fetch-depth: 0

      - name: Check if due
        id: gate
        run: |
          last_epoch=$(git log -1 --format=%ct -- public/seed-games.json)
          now_epoch=$(date +%s)
          elapsed_min=$(( (now_epoch - last_epoch) / 60 ))
          if [ "$elapsed_min" -lt 90 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping -- already updated $elapsed_min minute(s) ago (threshold: 90)"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Due -- last update was $elapsed_min minute(s) ago"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Fetch odds and scores
        if: steps.gate.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        run: node scripts/run.mjs

      - name: Commit if changed
        if: steps.gate.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "rlm-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/seed-games.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Auto-update game data [skip ci]"
          git push

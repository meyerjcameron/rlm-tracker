<title>RLM Tracker: Five Directions</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Space+Mono:wght@400;700&family=Archivo:wght@500;700;800&family=JetBrains+Mono:wght@400;500;700&family=Kalam:wght@700&family=Work+Sans:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Archivo+Narrow:wght@500;600;700&family=Anton&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --shell-bg:#0d0f12; --shell-panel:#15181d; --shell-line:#262b32;
    --shell-text:#e8eaed; --shell-dim:#8a919c; --shell-accent:#e8b84b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--shell-bg); color:var(--shell-text);
    font-family:'Archivo',sans-serif; padding-block:28px; padding-inline:20px;
  }
  .shell-head{ max-width:1180px; margin:0 auto 22px; }
  .shell-head h1{
    font-family:'Archivo',sans-serif; font-weight:800; font-size:clamp(22px,3vw,30px);
    margin:0 0 6px; letter-spacing:-0.01em; text-wrap:balance;
  }
  .shell-head p{ margin:0; color:var(--shell-dim); font-size:14px; max-width:62ch; line-height:1.55; }

  .switcher{
    max-width:1180px; margin:0 auto 22px; display:flex; gap:8px; flex-wrap:wrap;
    border-bottom:1px solid var(--shell-line); padding-bottom:14px;
  }
  .switcher button{
    font-family:'Archivo',sans-serif; font-weight:600; font-size:13px; color:var(--shell-dim);
    background:var(--shell-panel); border:1px solid var(--shell-line); border-radius:8px;
    padding:9px 14px; cursor:pointer; transition:color .15s,border-color .15s,background .15s;
  }
  .switcher button:hover{ color:var(--shell-text); }
  .switcher button.active{ color:#14161a; background:var(--shell-accent); border-color:var(--shell-accent); }
  .switcher button .n{ opacity:.6; margin-right:6px; font-family:'JetBrains Mono',monospace; }
  .switcher button.active .n{ opacity:.5; }

  .stage-wrap{ max-width:1180px; margin:0 auto; }
  .stage{ display:none; border-radius:14px; overflow:hidden; }
  .stage.active{ display:block; }
  .stage-label{
    max-width:1180px; margin:0 auto 12px; font-family:'JetBrains Mono',monospace;
    font-size:12px; color:var(--shell-dim); display:flex; gap:10px; align-items:baseline; flex-wrap:wrap;
  }
  .stage-label b{ color:var(--shell-text); font-size:13px; }

  /* ============================================================
     SHARED CARD SKELETON -- every theme below restyles these same
     classes via CSS custom properties, so structure never repeats.
     ============================================================ */
  .app{ padding:28px clamp(16px,3vw,32px) 40px; }
  .app-head h2{ margin:0 0 6px; }
  .app-head p{ margin:0 0 18px; max-width:56ch; line-height:1.55; }
  .tabs{ display:flex; gap:4px; margin-bottom:16px; }
  .tabs span{ padding:7px 4px; cursor:default; }
  .pills{ display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
  .pill{ display:inline-flex; align-items:center; gap:7px; padding:7px 13px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; }
  .card{ padding:18px; }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:4px; }
  .matchup{ display:flex; align-items:baseline; gap:7px; flex-wrap:wrap; }
  .meta{ font-size:12.5px; margin-top:3px; }
  .book-row{ display:inline-flex; gap:6px; margin:12px 0; }
  .book-chip{ padding:5px 11px; font-size:12px; }
  .flag-box{ padding:10px 12px; font-size:13px; line-height:1.5; margin-bottom:12px; }
  .stats{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .stat{ flex:1; padding:10px 12px; }
  .stat-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; }
  .stat-val{ font-size:17px; }
  .stat-move{ font-size:11px; margin-top:3px; }
  .arrow{ font-size:15px; opacity:.5; }
  .book-line{ display:flex; justify-content:space-between; padding:9px 12px; font-size:13px; margin-bottom:12px; }
  .split-labels{ display:flex; justify-content:space-between; font-size:12px; margin-bottom:6px; }
  .split-bar{ height:7px; overflow:hidden; display:flex; }
  .hist{ font-size:11.5px; margin-top:12px; opacity:.75; }
  .rank{ font-size:10.5px; font-weight:800; padding:1px 6px; }
  tabular{ font-variant-numeric:tabular-nums; }
</style>

<!-- ============================= CHROME ============================= -->
<div class="shell-head">
  <h1>RLM Tracker &mdash; five directions</h1>
  <p>Same two cards, five different visual identities. Flip between them to compare type, color and layout side by side before we commit one to the real app.</p>
</div>

<div class="switcher" id="switcher"></div>
<div class="stage-label" id="stageLabel"></div>
<div class="stage-wrap" id="stageWrap"></div>

<script>
const THEMES = [
  { key:'wire',  n:'01', name:'Wire Room',  sub:'CRT odds-board amber on black &mdash; a Vegas sportsbook ticker.' },
  { key:'ledger',n:'02', name:'The Ledger', sub:'Quant trading-terminal cyan &mdash; treats lines as tick data.' },
  { key:'chalk', n:'03', name:'Chalk Line', sub:'Hand-chalked board green &mdash; the physical betting-shop board.' },
  { key:'broad', n:'04', name:'Broadsheet', sub:'Newsprint agate type &mdash; sports-page box-score convention.' },
  { key:'turf',  n:'05', name:'Field Turf', sub:'Bright turf green & white &mdash; a modern mobile sports app.' },
];

const CARD_HTML = `
  <div class="app">
    <div class="app-head">
      <h2>RLM Tracker</h2>
      <p>Log lines across sportsbooks alongside the public bet split. Flags a game when the line moves against the side the public is backing.</p>
    </div>
    <div class="tabs"><span class="tab-on">NFL</span><span class="tab-off">CFB</span></div>
    <div class="pills">
      <span class="pill pill-a">&#8599; 15 of 16 showing a line change</span>
      <span class="pill pill-b">&#9679; 3 of 16 showing RLM</span>
    </div>
    <div class="grid">
      <div class="card card-flag">
        <div class="card-top">
          <div>
            <div class="matchup">DET <span class="at">@</span> BUF</div>
            <div class="meta meta-1">Spread &middot; DET vs BUF</div>
            <div class="meta meta-2">Thu, Sep 17 &middot; 7:15 PM CT</div>
          </div>
          <span class="tag">NFL</span>
        </div>
        <div class="book-row"><span class="book-chip chip-on">All books</span><span class="book-chip chip-off">CBS</span></div>
        <div class="flag-box">BUF has the public majority, but the consensus line moved toward BUF.</div>
        <div class="stats">
          <div class="stat"><div class="stat-label">Open (avg)</div><div class="stat-val tabular">BUF &minus;3</div></div>
          <span class="arrow">&rarr;</span>
          <div class="stat"><div class="stat-label">Current (avg)</div><div class="stat-val tabular">BUF &minus;4.5</div><div class="stat-move">moved 1.5 pts</div></div>
        </div>
        <div class="book-line"><span>CBS</span><span class="tabular">opened &minus;3&nbsp;&nbsp;&minus;4.5</span></div>
        <div class="split-labels"><span>DET 27%</span><span>73% BUF</span></div>
        <div class="split-bar"><span style="width:27%;" class="split-a"></span><span style="width:73%;" class="split-b"></span></div>
        <div class="hist">History (3)</div>
      </div>

      <div class="card">
        <div class="card-top">
          <div>
            <div class="matchup"><span class="rank">#5</span> MIAMI <span class="at">@</span> WAKE</div>
            <div class="meta meta-1">Spread &middot; MIAMI vs WAKE</div>
            <div class="meta meta-2">Fri, Sep 18 &middot; 6:30 PM CT</div>
          </div>
          <span class="tag">CFB</span>
        </div>
        <div class="book-row"><span class="book-chip chip-on">All books</span><span class="book-chip chip-off">CBS</span></div>
        <div class="stats">
          <div class="stat"><div class="stat-label">Open (avg)</div><div class="stat-val tabular">MIAMI &minus;19.5</div></div>
          <span class="arrow">&rarr;</span>
          <div class="stat"><div class="stat-label">Current (avg)</div><div class="stat-val tabular">MIAMI &minus;20.5</div><div class="stat-move">moved 1.0 pts</div></div>
        </div>
        <div class="book-line"><span>CBS</span><span class="tabular">opened &minus;19.5&nbsp;&nbsp;&minus;20.5</span></div>
        <div class="hist">History (2)</div>
      </div>
    </div>
  </div>
`;

const swEl = document.getElementById('switcher');
const stageWrap = document.getElementById('stageWrap');
const stageLabel = document.getElementById('stageLabel');

THEMES.forEach((t,i)=>{
  const b = document.createElement('button');
  b.innerHTML = `<span class="n">${t.n}</span>${t.name}`;
  b.dataset.key = t.key;
  b.onclick = ()=>select(t.key);
  swEl.appendChild(b);

  const stage = document.createElement('div');
  stage.className = 'stage theme-'+t.key;
  stage.dataset.key = t.key;
  stage.innerHTML = CARD_HTML;
  stageWrap.appendChild(stage);
});

function select(key){
  document.querySelectorAll('.switcher button').forEach(b=>b.classList.toggle('active', b.dataset.key===key));
  document.querySelectorAll('.stage').forEach(s=>s.classList.toggle('active', s.dataset.key===key));
  const t = THEMES.find(x=>x.key===key);
  stageLabel.innerHTML = `<b>${t.n} &mdash; ${t.name}</b><span>${t.sub}</span>`;
}
select(THEMES[0].key);
</script>

     ====================================================================== -->

.theme-wire .split-bar{ background:#171610; }

.theme-wire .hist{ color:#5c5645; border-top:1px solid #2b2a20; padding-top:8px; text-transform:uppercase; font-size:10.5px; letter-spacing:.04em; }
</style>

     ====================================================================== -->
<style>
